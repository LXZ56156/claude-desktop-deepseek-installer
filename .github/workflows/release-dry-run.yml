name: Release dry run

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      POWERSHELL_UPDATECHECK: 'Off'
      POWERSHELL_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bind trusted runner tool grants
        shell: pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Get-TrustedToolGrant {
            param(
              [Parameter(Mandatory = $true)][string]$ToolId,
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string]$ExpectedLeaf
            )

            if ([string]::IsNullOrWhiteSpace($Path) -or $Path.IndexOfAny([char[]]"`r`n") -ge 0) {
              throw "$ToolId path is empty or unsafe."
            }
            $fullPath = [System.IO.Path]::GetFullPath($Path)
            if (-not [System.IO.Path]::IsPathRooted($fullPath)) {
              throw "$ToolId path must be absolute."
            }
            $item = Get-Item -LiteralPath $fullPath -Force -ErrorAction Stop
            if ($item.PSIsContainer -or $item.Name -cne $ExpectedLeaf) {
              throw "$ToolId executable identity is unexpected."
            }
            if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "$ToolId executable must not be a reparse point."
            }
            $sha256 = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256 -ErrorAction Stop).Hash.ToLowerInvariant()
            if ($sha256 -notmatch '^[a-f0-9]{64}$') {
              throw "$ToolId SHA-256 is invalid."
            }
            return [pscustomobject]@{ Path = $item.FullName; Sha256 = $sha256 }
          }

          $gitCommand = Get-Command git.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $pwsh7 = Get-TrustedToolGrant -ToolId PowerShell7 -Path (Join-Path $PSHOME 'pwsh.exe') -ExpectedLeaf 'pwsh.exe'
          $windowsPowerShell = Get-TrustedToolGrant -ToolId WindowsPowerShell -Path (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe') -ExpectedLeaf 'powershell.exe'
          $git = Get-TrustedToolGrant -ToolId Git -Path $gitCommand.Source -ExpectedLeaf 'git.exe'

          $grantLines = @(
            "CDDSI_PWSH7_PATH=$($pwsh7.Path)"
            "CDDSI_PWSH7_SHA256=$($pwsh7.Sha256)"
            "CDDSI_WINDOWS_POWERSHELL_PATH=$($windowsPowerShell.Path)"
            "CDDSI_WINDOWS_POWERSHELL_SHA256=$($windowsPowerShell.Sha256)"
            "CDDSI_GIT_PATH=$($git.Path)"
            "CDDSI_GIT_SHA256=$($git.Sha256)"
          )
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_ENV) -or
              $env:GITHUB_ENV.IndexOfAny([char[]]"`r`n") -ge 0 -or
              -not [System.IO.Path]::IsPathRooted($env:GITHUB_ENV)) {
            throw 'GITHUB_ENV is unavailable.'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value $grantLines -Encoding utf8

      - name: Verify vendored Pester lock
        shell: pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        run: ./scripts/bootstrap-dev.ps1

      - name: Run named product gate and independent historical diagnostics
        shell: pwsh -NoLogo -NoProfile -NonInteractive -File {0}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $result = ./scripts/invoke-release-gates.ps1 `
            -PowerShell7Executable $env:CDDSI_PWSH7_PATH `
            -PowerShell7Sha256 $env:CDDSI_PWSH7_SHA256 `
            -WindowsPowerShellExecutable $env:CDDSI_WINDOWS_POWERSHELL_PATH `
            -WindowsPowerShellSha256 $env:CDDSI_WINDOWS_POWERSHELL_SHA256 `
            -GitExecutable $env:CDDSI_GIT_PATH `
            -GitSha256 $env:CDDSI_GIT_SHA256 `
            -ProcessTimeoutSeconds 900 `
            -PassThru

          $expectedPropertySet = 'BindingSha256,ContractVersion,EvidenceType,HistoricalDiagnosticEvidence,HistoricalDiagnosticEvidenceSha256,HistoricalDiagnosticResult,HistoricalReleaseBlocking,HistoricalStatus,ProductGateEvidenceSha256,ProductGateStatus,ProductReleaseGateEvidence,SchemaVersion,Status'
          $actualPropertySet = @($result.PSObject.Properties.Name | Sort-Object) -join ','
          if ($actualPropertySet -cne $expectedPropertySet -or
              $result.SchemaVersion -ne 1 -or
              $result.EvidenceType -cne 'CddsiNamedReleaseGateRunEvidence' -or
              $result.ContractVersion -cne 'D-026' -or
              $result.Status -cne 'PASSED' -or
              $result.ProductGateStatus -cne 'PASSED' -or
              $result.HistoricalStatus -cne 'COMPLETED' -or
              $result.HistoricalDiagnosticResult -notin @('PASSED', 'FAILED_TESTS') -or
              $result.HistoricalReleaseBlocking -isnot [bool] -or
              $result.HistoricalReleaseBlocking) {
            throw 'Named release-gate run evidence is invalid.'
          }
          foreach ($hashName in @(
            'BindingSha256'
            'ProductGateEvidenceSha256'
            'HistoricalDiagnosticEvidenceSha256'
          )) {
            if ([string]$result.$hashName -notmatch '^[a-f0-9]{64}$') {
              throw "Named release-gate hash is invalid: $hashName"
            }
          }

          $product = $result.ProductReleaseGateEvidence
          if ($product.Status -cne 'PASSED' -or
              $product.EnforcementPhase -cne 'NamedProductReleaseGate' -or
              $product.QualitySet -cne 'ProductReleaseBlocking' -or
              $product.ReleaseBlocking -isnot [bool] -or
              -not $product.ReleaseBlocking -or
              $product.ExpectedPesterFileCount -ne 29 -or
              $product.ExpectedWorkerCount -ne 18 -or
              $product.ExpectedProcessCount -ne 21 -or
              $product.ExpectedLedgerEntryCount -ne 48 -or
              $product.ProductQualityEvidence.CLEANUP_OUTCOME -cne 'Succeeded' -or
              $product.ReleaseDryRunEvidence.Status -cne 'SUCCEEDED' -or
              $product.ReleaseDryRunEvidence.Operation -cne 'ReleaseSimulation' -or
              $product.ReleaseDryRunEvidence.Mode -cne 'DryRun') {
            throw 'ProductReleaseGate evidence is invalid.'
          }

          $historical = $result.HistoricalDiagnosticEvidence
          if ($historical.Status -cne 'COMPLETED' -or
              $historical.DiagnosticResult -cne $result.HistoricalDiagnosticResult -or
              $historical.QualitySet -cne 'HistoricalDiagnostic' -or
              $historical.ReleaseBlocking -isnot [bool] -or
              $historical.ReleaseBlocking -or
              $historical.ExpectedPesterFileCount -ne 13 -or
              $historical.ExpectedWorkerCount -ne 20 -or
              $historical.ExpectedProcessCount -ne 23 -or
              $historical.ExpectedLedgerEntryCount -ne 52 -or
              $historical.CoreQualityEvidence.CLEANUP_OUTCOME -cne 'Succeeded') {
            throw 'Historical diagnostic evidence is invalid.'
          }
