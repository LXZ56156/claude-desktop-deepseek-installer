name: ci

on:
  pull_request:
  push:
    branches:
      - codex/repair/p10a-0a-fast-lane

jobs:
  practical-gate:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run focused Windows PowerShell 5.1 gate
        shell: powershell
        run: .\scripts\check.ps1
