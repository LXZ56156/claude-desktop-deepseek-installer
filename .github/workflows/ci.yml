name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap repository-local Pester
        shell: pwsh
        run: ./scripts/bootstrap-dev.ps1
      - name: Run syntax, contract, encoding, secret and Pester checks
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Run Pester contracts on Windows PowerShell 5.1
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          Import-Module .\.dev\modules\Pester\5.6.1\Pester.psd1 -Force
          $result = Invoke-Pester -Path .\tests -Output Detailed -PassThru
          if ($result.Result -ne 'Passed' -or $result.FailedCount -ne 0 -or $result.SkippedCount -ne 0 -or $result.NotRunCount -ne 0) { throw 'Windows PowerShell 5.1 Pester contracts failed.' }
      - name: Validate release allow-list without packaging
        shell: pwsh
        run: ./scripts/build-release.ps1 -DryRun -SkipQualityGate
